providers:
  llm:
    enabled: true
    default_provider: ollama_local
    local_first: true
    allow_cloud_fallback: true
    require_reason_for_cloud: true
    allow_real_secrets_in_repo: false
    ollama:
      preferred_fast_model: local_fast
      preferred_main_model: local_main
      max_loaded_models: 1
    codex:
      role: last_resort_for_code
  mt5:
    enabled: false
    allowed_modes:
      - market_watch
      - shadow_decision
      - demo_future
    blocked_calls:
      - mt5.order_send
  xtb:
    enabled: false
    allowed_modes:
      - manual
      - assisted_reporting
    blocked_actions:
      - click_automation
      - order_robot
