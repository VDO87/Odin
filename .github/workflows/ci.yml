name: ODIN CI

on:
  push:
    branches: ["release/rc1"]
  pull_request:
    branches: ["release/rc1"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LOCAL_LLM_ENABLED: "true"
      LOCAL_LLM_PROVIDER: "ollama"
      LOCAL_LLM_MODEL: ""
      ENABLE_REAL_TRADING: "false"
      ENABLE_AUTO_EXECUTION: "false"
      MT5_ORDER_SEND_ENABLED: "false"
      XTB_REAL_ENABLED: "false"
      BROKER_ALLOW_REAL_EXECUTION: "false"
      OPENAI_SUPPORT_ENABLED: "false"
      ODIN_MODE: "SHADOW_MT5"
      ODIN_ENV: "TEST"
      ODIN_SOAK_TEST_MINI_DURATION_SECONDS: "3"
      ODIN_SOAK_TEST_CYCLE_SLEEP_SECONDS: "0.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy .

      - name: Runtime smoke-test
        run: ./run_odin.sh --runtime-smoke-test

      - name: Runtime run-once
        run: ./run_odin.sh --run-once

      - name: Runtime validate
        run: ./run_odin.sh --runtime-validate

      - name: Soak test mini
        run: ./run_odin.sh --soak-test-mini

      - name: Dashboard visual QA
        run: python -m apps.dashboard_html.app --dashboard-qa

      - name: Dashboard TUI smoke
        run: python -m apps.dashboard_tui.app --smoke-test

      - name: Dashboard preview via runner
        run: ./run_odin.sh --dashboard-preview

      - name: TUI smoke via runner
        run: ./run_odin.sh --tui-smoke-test
