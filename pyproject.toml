[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odin"
version = "0.1.0"
description = "Odin repository skeleton and engineering baseline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "mypy>=1.11.0",
]
memory = [
    "mempalace>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_configs = true
check_untyped_defs = true
strict_optional = true
exclude = "^(apps/|Odin_Teste_BACKUP_.*?/|Odin_GitHub_Check/)"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
odin-core = "apps.core_service:main"
odin-core-daemon = "apps.core_daemon:main"
odin-validate-config = "apps.validate_config:main"
odin-operator-console = "apps.operator_console:main"
